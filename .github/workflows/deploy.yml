name: Deploy to Cloud Run

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    # main → prod, cualquier otra rama (develop, feature branches via
    # workflow_dispatch) → dev. El environment también resuelve los
    # vars/secrets scopados al ambiente.
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Debug — show resolved deploy vars
        run: |
          echo "DEPLOY_ENV=${{ env.DEPLOY_ENV }}"
          echo "GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"
          echo "GCP_REGION=${{ env.GCP_REGION }}"
          echo "SERVICE_NAME=${{ env.SERVICE_NAME }}"
          echo "VPC_CONNECTOR=${{ vars.VPC_CONNECTOR }}"
          echo "VPC_NETWORK=${{ vars.VPC_NETWORK }}"
          echo "VPC_SUBNET=${{ vars.VPC_SUBNET }}"
          echo "RUNTIME_SERVICE_ACCOUNT=${{ vars.RUNTIME_SERVICE_ACCOUNT }}"
          echo "KAFKA_ENABLED=${{ vars.KAFKA_ENABLED }}"
          echo "KAFKA_BOOTSTRAP_SERVERS=${{ vars.KAFKA_BOOTSTRAP_SERVERS }}"
          echo "KAFKA_TOPIC=${{ vars.KAFKA_TOPIC }}"
          echo "KAFKA_SECURITY_PROTOCOL=${{ vars.KAFKA_SECURITY_PROTOCOL }}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}
          flags: >-
            --allow-unauthenticated
            --port=8000
            ${{ vars.RUNTIME_SERVICE_ACCOUNT && format('--service-account={0}', vars.RUNTIME_SERVICE_ACCOUNT) || '' }}
            ${{ vars.VPC_CONNECTOR && format('--vpc-connector={0}', vars.VPC_CONNECTOR) || '' }}
            ${{ vars.VPC_NETWORK && format('--network={0}', vars.VPC_NETWORK) || '' }}
            ${{ vars.VPC_SUBNET && format('--subnet={0}', vars.VPC_SUBNET) || '' }}
            ${{ (vars.VPC_CONNECTOR || vars.VPC_NETWORK) && '--vpc-egress=private-ranges-only' || '' }}
          env_vars: |
            APP_ENV=${{ env.DEPLOY_ENV }}
            APP_DEBUG=${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}
            KAFKA_ENABLED=${{ vars.KAFKA_ENABLED }}
            KAFKA_BOOTSTRAP_SERVERS=${{ vars.KAFKA_BOOTSTRAP_SERVERS }}
            KAFKA_TOPIC=${{ vars.KAFKA_TOPIC }}
            KAFKA_CLIENT_ID=${{ vars.KAFKA_CLIENT_ID }}
            KAFKA_SECURITY_PROTOCOL=${{ vars.KAFKA_SECURITY_PROTOCOL }}
            KAFKA_SASL_MECHANISM=${{ vars.KAFKA_SASL_MECHANISM }}
            KAFKA_SASL_USERNAME=${{ vars.KAFKA_SASL_USERNAME }}
            NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }}
            NEW_RELIC_APP_NAME=${{ vars.NEW_RELIC_APP_NAME || (github.ref == 'refs/heads/main' && 'miso-travelhub-service-payments-prod' || 'miso-travelhub-service-payments-dev') }}
            NEW_RELIC_ENVIRONMENT=${{ env.DEPLOY_ENV }}
            NEW_RELIC_LOG=stdout
            NEW_RELIC_LOG_LEVEL=${{ vars.NEW_RELIC_LOG_LEVEL || 'info' }}
            NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=true
          secrets: |
            ${{ vars.KAFKA_SASL_PASSWORD_SECRET && format('KAFKA_SASL_PASSWORD={0}:latest', vars.KAFKA_SASL_PASSWORD_SECRET) || '' }}
